<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengingat Agenda Penting</title>
<meta name="theme-color" content="#1d3557">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="logo/ikon-192.png">
<link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16202e;--mute:#5d6878;--line:#d9dde4;--navy:#1d3557;--navy-ink:#fff;--warn:#b86e00;--warnbg:#fff3d6;--bad:#b3261e;--badbg:#fde4e1;--ok:#23704f;--okbg:#e0f2ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151d;--card:#19212d;--ink:#e8ecf2;--mute:#9aa5b5;--line:#2c3646;--navy:#0b1220;--navy-ink:#f1f4f9;--warn:#f0b24a;--warnbg:#3a2c10;--bad:#ff9189;--badbg:#3d1a18;--ok:#6fd2a4;--okbg:#14342a}}
:root[data-theme="dark"]{--bg:#10151d;--card:#19212d;--ink:#e8ecf2;--mute:#9aa5b5;--line:#2c3646;--navy:#0b1220;--navy-ink:#f1f4f9;--warn:#f0b24a;--warnbg:#3a2c10;--bad:#ff9189;--badbg:#3d1a18;--ok:#6fd2a4;--okbg:#14342a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Source Sans 3",system-ui,sans-serif}
h1,h2,.num{font-family:Archivo,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.hero{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:22px 20px;margin-bottom:20px}
.hero h1{font-size:15px;font-weight:500;margin:0 0 12px;opacity:.8}
.alert{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.18)}
.alert:first-of-type{border-top:0;padding-top:0}
.alert .num{font-size:34px;font-weight:800;line-height:1;min-width:76px}
.alert .t{font-weight:600}.alert small{display:block;opacity:.75}
.aman{margin:0;font-size:20px;font-family:Archivo;font-weight:700}
h2{font-size:18px;margin:26px 0 10px}
.item{background:var(--card);border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.item.bad{border-left-color:var(--bad)}.item.warn{border-left-color:var(--warn)}.item.ok{border-left-color:var(--ok)}
.item b{font-size:17px}.item .meta{color:var(--mute);font-size:14px}
.badge{justify-self:end;align-self:start;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.bad .badge{background:var(--badbg);color:var(--bad)}.warn .badge{background:var(--warnbg);color:var(--warn)}.ok .badge{background:var(--okbg);color:var(--ok)}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px}
button:hover{background:var(--bg)}
button.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:600}
button.pri:hover{opacity:.9;background:var(--navy)}
button.del{color:var(--bad)}
:focus-visible{outline:3px solid #4c8dff;outline-offset:2px}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute);font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.full{grid-column:1/-1}
.hint{font-size:13px;color:var(--mute);margin:0}
.empty{color:var(--mute);padding:16px;border:1px dashed var(--line);border-radius:10px}
footer{color:var(--mute);font-size:13px;margin:26px 0 8px}
@media (max-width:520px){form{grid-template-columns:1fr}.alert .num{font-size:28px;min-width:62px}}
#auth{max-width:560px;margin:40px auto}#auth form{grid-template-columns:1fr}.err{color:var(--bad);font-size:14px;margin:0;min-height:1.2em}
.dsel{display:flex;gap:6px}.dsel select:first-child{max-width:78px}.dsel select:nth-child(2){min-width:0}
[hidden]{display:none!important}
.alert .j{color:#ffd166;font-weight:700}.alert .v{color:#7dd3fc}.alert .n{color:#86efac;font-weight:700}
.num.urg{color:#ff6b6b;animation:kedip 1s ease-in-out infinite}
@keyframes kedip{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.num.urg{animation:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<main>
<div id="inst" class="item ok" hidden style="align-items:center">
  <div><b>Pasang di HP</b><div class="meta" id="insttxt">Buka agenda langsung dari layar utama, seperti aplikasi.</div></div>
  <button class="pri" id="instbtn">Pasang</button>
</div>
<section id="auth" hidden>
<div class="hero" aria-live="polite"><h1>Pengumuman</h1><div id="pubalerts"><p class="aman">Memuat…</p></div></div>
<h2>Masuk ke Pengingat Agenda</h2>
<form id="af">
  <label>Email<input id="em" type="email" required autocomplete="email"></label>
  <label>Kata sandi (min. 6 karakter)<input id="pw" type="password" required minlength="6" autocomplete="current-password"></label>
  <p class="err" id="aerr" role="alert"></p>
  <div><button class="pri" type="submit">Masuk</button> <button type="button" id="signup">Daftar akun baru</button></div>
</form>
</section>
<div id="app" hidden>
<section class="hero" aria-live="polite">
  <h1 id="today"></h1>
  <div id="alerts"></div>
</section>

<h2>Semua agenda</h2>
<div id="list"></div>

<h2 id="ftitle">Tambah agenda</h2>
<form id="f">
  <label>Jenis
    <select id="cat">
      <option value="stnk">HER STNK (tahunan / 5 tahunan otomatis)</option>
      <option value="sim">HER SIM (5 tahunan)</option>
      <option value="ultah">Ulang tahun</option>
      <option value="nikah">Ulang tahun pernikahan</option>
      <option value="lain">Lainnya (sekali saja)</option>
    </select>
  </label>
  <label id="lbl-owner">Atas nama<input id="owner" maxlength="60" placeholder="Contoh: ARWANI MA'RUF"></label>
  <label id="lbl-veh">Jenis kendaraan<input id="veh" maxlength="40" placeholder="Contoh: Motor VARIO"></label>
  <label id="lbl-col">Warna kendaraan<input id="col" maxlength="30" placeholder="Contoh: Merah"></label>
  <label id="lbl-five">Tahun kendaraan<select id="five"></select></label>
  <label id="lbl-title" class="full">Judul agenda<input id="title" maxlength="80" placeholder="Contoh: Bayar asuransi rumah"></label>
  <label id="dlabel">Tanggal jatuh tempo<span class="dsel"><select id="dd" aria-label="Tanggal"></select><select id="dm" aria-label="Bulan"></select><select id="dy" aria-label="Tahun"></select></span></label>
  <label>Ingatkan sebelum
    <select id="lead"><option value="7">7 hari</option><option value="14">14 hari</option><option value="30" selected>30 hari</option><option value="60">60 hari</option><option value="90">90 hari</option></select>
  </label>
  <label>Catatan (opsional)<input id="note" maxlength="120" placeholder="Contoh: bawa KTP asli dan BPKB"></label>
  <label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="pub" style="width:auto"> Tampilkan sebagai pengumuman publik (terlihat tanpa login)</label>
  <p class="hint full" id="hint"></p>
  <div class="full"><button class="pri" type="submit" id="save">Simpan agenda</button> <button type="button" id="cancel" hidden>Batal</button></div>
</form>

<footer><span id="sync">Memeriksa penyimpanan…</span> Buka halaman ini secara berkala untuk melihat pengumuman terbaru.</footer>
<button id="logout">Keluar</button>
</div>
</main>

<script>
var KEY="agenda-penting-v1";
var CAT={stnk1:{n:"HER STNK tahunan",step:1,mode:"renew"},stnk:{n:"HER STNK",step:1,mode:"renew"},stnk5:{n:"HER STNK 5 tahunan",step:5,mode:"renew"},sim:{n:"HER SIM (5 tahunan)",step:5,mode:"renew"},ultah:{n:"Ulang tahun",step:1,mode:"auto"},nikah:{n:"Ulang tahun pernikahan",step:1,mode:"auto"},lain:{n:"Lainnya",step:0,mode:"none"}};
var HINT={stnk:"Isi tanggal jatuh tempo pajak STNK terdekat dan tahun kendaraan (tahun pertama STNK terbit). Aplikasi otomatis menulis HER STNK TAHUNAN atau 5 TAHUNAN: setiap kelipatan 5 tahun dari tahun kendaraan. Setelah diperpanjang, tekan “Sudah diperpanjang” agar jatuh tempo maju 1 tahun.",stnk1:"Isi dengan tanggal batas pajak tahunan di STNK. Setelah diperpanjang, tekan tombol “Sudah diperpanjang” agar jatuh tempo maju 1 tahun.",stnk5:"Isi dengan tanggal berakhirnya STNK 5 tahunan (ganti plat). Setelah diperpanjang, jatuh tempo maju 5 tahun.",sim:"Isi dengan tanggal masa berlaku SIM (tertera di kartu SIM). Setelah diperpanjang, tekan “Sudah diperpanjang” agar jatuh tempo maju 5 tahun.",ultah:"Isi dengan tanggal lahir. Agenda akan berulang otomatis setiap tahun.",nikah:"Isi dengan tanggal pernikahan. Agenda akan berulang otomatis setiap tahun.",lain:"Agenda sekali saja, tidak berulang."};
var MON=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var items=[],editId=null,keep=null;
function $(i){return document.getElementById(i)}
function load(){try{var r=localStorage.getItem(KEY);if(r){items=JSON.parse(r);return}}catch(e){}
  var y=new Date().getFullYear();
  items=[{id:1,name:"HER STNK Honda Vario (contoh)",cat:"stnk1",date:iso(addDays(today(),12)),lead:30,note:"Bawa KTP asli dan BPKB"},
         {id:2,name:"Ulang tahun Ibu (contoh)",cat:"ultah",date:(y-55)+"-12-02",lead:14,note:""},
         {id:3,name:"STNK 5 tahunan Avanza (contoh)",cat:"stnk5",date:iso(addDays(today(),200)),lead:60,note:""}];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
var SB_URL="https://besfvlmwsksuhryizlev.supabase.co",SB_KEY="sb_publishable_zXNxTWL9vR7NgsP110b_Tg_K6Ytag4q",sb=null;
function setSync(t){$("sync").textContent=t}
function fail(e){setSync("Gagal menyimpan: "+(e&&e.message?e.message:"periksa koneksi")+".")}
function clean(it){return{id:it.id,name:it.name,cat:it.cat,date:it.date,lead:it.lead,note:it.note||"",publik:!!it.publik,owner:it.owner||"",vehicle:it.vehicle||"",color:it.color||"",five:it.five||0}}
function put(it){sb.from("agenda").upsert(clean(it)).then(function(r){if(r.error)fail(r.error)})}
function rm(id){sb.from("agenda").delete().eq("id",id).then(function(r){if(r.error)fail(r.error)})}
function show(on){$("auth").hidden=on;$("app").hidden=!on}
async function loadRows(){
  var r=await sb.from("agenda").select("*");
  if(r.error){try{var c=localStorage.getItem("agenda-cache");if(c){items=JSON.parse(c);render();setSync("Mode offline: menampilkan data terakhir yang tersimpan.");return}}catch(e){}fail(r.error);return}
  items=r.data;try{localStorage.setItem("agenda-cache",JSON.stringify(items))}catch(e){}render();setSync("Tersinkron: agenda tampil di semua perangkat tempat kamu masuk.")}
async function loadPublic(){
  var r=await sb.from("agenda").select("id,name,cat,date,lead,note").eq("publik",true);
  var box=$("pubalerts");
  if(r.error){box.innerHTML='<p class="aman">Pengumuman belum bisa dimuat.</p>';return}
  var al=r.data.map(function(it){return{it:it,i:info(it)}}).filter(function(x){return x.i.st!=="ok"}).sort(function(a,b){return a.i.left-b.i.left});
  box.innerHTML=al.length?al.map(function(x){var n=x.i.left<0?"−"+(-x.i.left):x.i.left;
    return '<div class="alert"><div class="num'+(x.i.left<=5?' urg':'')+'">'+(x.i.left===0?"Hari ini":n+" hr")+'</div><div class="t">'+rich(x.it.name)+'<small>'+(x.i.left<0?"Lewat dari ":"Batas ")+fmt(x.i.date)+(x.it.note?" · "+esc(x.it.note):"")+'</small></div></div>'}).join("")
    :'<p class="aman">Tidak ada pengumuman saat ini.</p>'}
async function initDb(){
  if(SB_URL.indexOf("ISI_")===0){show(false);$("aerr").textContent="Isi SB_URL dan SB_KEY di file ini terlebih dulu.";return}
  sb=supabase.createClient(SB_URL,SB_KEY);
  sb.auth.onAuthStateChange(function(ev,ses){if(ses){show(true);loadRows()}else{items=[];show(false);loadPublic()}});
  var r=await sb.auth.getSession();if(!r.data.session){show(false);loadPublic()}}
$("af").addEventListener("submit",async function(e){e.preventDefault();if(!sb)return;$("aerr").textContent="";
  var r=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  if(r.error)$("aerr").textContent="Gagal masuk: "+r.error.message});
$("signup").addEventListener("click",async function(){if(!sb)return;$("aerr").textContent="";
  var r=await sb.auth.signUp({email:$("em").value,password:$("pw").value});
  $("aerr").textContent=r.error?"Gagal daftar: "+r.error.message:(r.data.session?"":"Akun dibuat. Cek email untuk konfirmasi, lalu masuk.")});
$("logout").addEventListener("click",function(){sb.auth.signOut()});
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function addYears(s,n){var d=parse(s);return iso(new Date(d.getFullYear()+n,d.getMonth(),d.getDate()))}
function fmt(d){return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()}
function nextDate(it){var c=CAT[it.cat],d=parse(it.date),t=today();
  if(c.mode==="auto"){var n=new Date(t.getFullYear(),d.getMonth(),d.getDate());if(n<t)n=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());return n}
  return d}
function info(it){var n=nextDate(it),left=Math.round((n-today())/864e5),st="ok",txt;
  if(left<0){st="bad";txt="Terlambat "+(-left)+" hari"}
  else if(left===0){st="bad";txt="Hari ini"}
  else{txt=left+" hari lagi";if(left<=7)st="bad";else if(left<=it.lead)st="warn"}
  var extra="";if(CAT[it.cat].mode==="auto"){var age=n.getFullYear()-parse(it.date).getFullYear();extra=it.cat==="ultah"?" · ke-"+age:" · tahun ke-"+age}
  return{date:n,left:left,st:st,txt:txt,extra:extra}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  $("today").textContent="Hari ini, "+fmt(today());
  var rows=items.map(function(it){return{it:it,i:info(it)}}).sort(function(a,b){return a.i.left-b.i.left});
  var al=rows.filter(function(r){return r.i.st!=="ok"});
  $("alerts").innerHTML=al.length?al.map(function(r){
    var n=r.i.left<0?"−"+(-r.i.left):r.i.left;
    return '<div class="alert"><div class="num'+(r.i.left<=5?' urg':'')+'">'+(r.i.left===0?"Hari ini":n+" hr")+'</div><div class="t">'+rich(r.it.name)+'<small>'+(r.i.left<0?"Lewat dari ":"Batas ")+fmt(r.i.date)+(r.it.note?" · "+esc(r.it.note):"")+'</small></div></div>'}).join("")
    :'<p class="aman">Tidak ada agenda yang perlu diurus sekarang.</p>';
  $("list").innerHTML=rows.length?rows.map(function(r){var it=r.it,c=CAT[it.cat];
    return '<div class="item '+r.i.st+'"><div><b>'+esc(it.name)+'</b><div class="meta">'+c.n+r.i.extra+' · '+fmt(r.i.date)+(it.publik?' · 🌐 publik':'')+(it.note?'<br>'+esc(it.note):'')+'</div></div><span class="badge">'+r.i.txt+'</span><div class="acts">'
    +(c.mode==="renew"?'<button class="pri" data-a="renew" data-id="'+it.id+'">Sudah diperpanjang (+'+c.step+' thn)</button>':'')
    +'<button data-a="edit" data-id="'+it.id+'">Ubah</button><button class="del" data-a="del" data-id="'+it.id+'">Hapus</button></div></div>'}).join("")
    :'<div class="empty">Belum ada agenda. Tambahkan agenda pertama di formulir bawah.</div>';
}
$("list").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var id=+b.dataset.id,it=items.find(function(x){return x.id===id});if(!it)return;
  if(b.dataset.a==="renew"){it.date=addYears(it.date,CAT[it.cat].step);if(it.cat==="stnk"&&it.vehicle)it.name=buildName(it);put(it);render()}
  else if(b.dataset.a==="del"){if(confirm("Hapus agenda “"+it.name+"”?")){items=items.filter(function(x){return x.id!==id});rm(id);render()}}
  else{editId=id;var pr=parseName(it),legacy=(it.cat==="stnk1"||it.cat==="stnk5");
    $("owner").value=it.owner||pr.owner||"";$("veh").value=it.vehicle||pr.vehicle||"";$("col").value=it.color||pr.color||"";$("title").value=it.cat==="lain"?it.name:"";
    var cc=it.cat,fy=it.five||"",need=isStnk(it.cat)?[$("owner").value,$("veh").value,$("col").value]:it.cat==="lain"?[]:[$("owner").value],loose=need.some(function(x){return!x});
    if(legacy&&!$("cat").querySelector('option[value="'+cc+'"]'))$("cat").appendChild(opt(cc,cc==="stnk5"?"HER STNK 5 tahunan (lama)":"HER STNK tahunan (lama)"));
    $("cat").value=cc;if(fy&&!$("five").querySelector('option[value="'+fy+'"]'))$("five").appendChild(opt(fy,fy));$("five").value=fy;setD(it.date);$("lead").value=it.lead;$("note").value=it.note||"";$("pub").disabled=false;$("pub").checked=!!it.publik;$("ftitle").textContent="Ubah agenda";$("save").textContent="Simpan perubahan";$("cancel").hidden=false;keep={name:it.name,loose:loose,cat:it.cat};hint();keep.sig=sig();$("f").scrollIntoView({behavior:"smooth"})}});
function hint(){var c=$("cat").value,st=isStnk(c);
  $("hint").textContent=HINT[c]+(st?" Agenda STNK otomatis tampil sebagai pengumuman publik.":"")+(c==="stnk"&&+$("five").value?" HER 5 TAHUNAN jatuh pada tahun "+lima(+$("five").value).join(", ")+".":"");
  var ln=(c==="lain"),lo=!!(keep&&keep.loose&&keep.cat===c);
  $("lbl-five").hidden=c!=="stnk";$("five").required=c==="stnk"&&!lo;
  $("lbl-veh").hidden=!st;$("veh").required=st&&!lo;$("lbl-col").hidden=!st;$("col").required=st&&!lo;
  $("lbl-title").hidden=!ln;$("title").required=ln&&!lo;$("lbl-owner").hidden=ln;$("owner").required=!ln&&!lo;
  $("lbl-owner").firstChild.textContent=c==="ultah"?"Nama yang berulang tahun":c==="nikah"?"Nama pasangan":"Atas nama";
  if(!st&&$("pub").disabled)$("pub").checked=false;
  if(st)$("pub").checked=true;$("pub").disabled=st;$("dlabel").firstChild.textContent=(c==="ultah"||c==="nikah")?"Tanggal lahir / menikah":"Tanggal jatuh tempo"}
function rich(name){var m,e=esc;
  if(m=name.match(/^(HER STNK (?:5 )?TAHUNAN) (.+) warna (.+) atas nama (.+)$/))
    return '<span class="j">'+e(m[1])+'</span> <span class="v">'+e(m[2])+' warna '+e(m[3])+'</span> atas nama <span class="n">'+e(m[4])+'</span>';
  if(m=name.match(/^(HER SIM) atas nama (.+)$/))
    return '<span class="j">'+e(m[1])+'</span> atas nama <span class="n">'+e(m[2])+'</span>';
  if(m=name.match(/^(Ulang tahun pernikahan|Ulang tahun) (.+)$/))
    return '<span class="j">'+e(m[1])+'</span> <span class="n">'+e(m[2])+'</span>';
  return e(name)}
function parseName(it){var n=it.name||"",m,r={};
  if(m=n.match(/^HER STNK (?:5 TAHUNAN |TAHUNAN )?(.+?) warna (.+?) atas nama (.+)$/i)){r.vehicle=m[1];r.color=m[2];r.owner=m[3]}
  else if(m=n.match(/^HER SIM atas nama (.+)$/i))r.owner=m[1];
  else if(m=n.match(/^Ulang tahun pernikahan (.+)$/i))r.owner=m[1];
  else if(m=n.match(/^Ulang tahun (.+)$/i))r.owner=m[1];
  return r}
function sig(){return[$("cat").value,$("owner").value,$("veh").value,$("col").value,$("title").value,$("five").value].join("|")}
function isStnk(c){return c==="stnk"||c==="stnk1"||c==="stnk5"}
function jenisStnk(o){var y=parse(o.date).getFullYear();return o.five&&y>o.five&&(y-o.five)%5===0?"5 TAHUNAN":"TAHUNAN"}
function lima(t){var y=today().getFullYear(),a=t+5*Math.max(1,Math.ceil((y-t)/5));return[a,a+5,a+10]}
function buildName(o){var c=o.cat;
  if(isStnk(c))return "HER STNK "+(c==="stnk"?jenisStnk(o):c==="stnk5"?"5 TAHUNAN":"TAHUNAN")+" "+o.vehicle+" warna "+o.color+" atas nama "+o.owner;
  if(c==="sim")return "HER SIM atas nama "+o.owner;
  if(c==="ultah")return "Ulang tahun "+o.owner;
  return "Ulang tahun pernikahan "+o.owner}
function reset(){editId=null;keep=null;["stnk1","stnk5"].forEach(function(v){var x=$("cat").querySelector('option[value="'+v+'"]');if(x)x.remove()});$("f").reset();setD(iso(today()));$("lead").value="30";$("ftitle").textContent="Tambah agenda";$("save").textContent="Simpan agenda";$("cancel").hidden=true;hint()}
$("cat").addEventListener("change",hint);$("five").addEventListener("change",hint);$("cancel").addEventListener("click",reset);
$("f").addEventListener("submit",function(e){e.preventDefault();
  var c=$("cat").value,st=isStnk(c),o={cat:c,five:c==="stnk"?(+$("five").value||0):0,owner:$("owner").value.trim(),vehicle:$("veh").value.trim(),color:$("col").value.trim(),date:getD(),lead:+$("lead").value,note:$("note").value.trim(),publik:$("pub").checked};
  if(c==="lain"){o.owner="";o.name=$("title").value.trim()}
  if(!st){o.vehicle="";o.color=""}
  if(c!=="lain")o.name=buildName(o);
  if(keep&&keep.loose&&keep.cat===c&&sig()===keep.sig)o.name=keep.name;
  if(!o.name||!o.date)return;
  var rec;
  if(editId){rec=items.find(function(x){return x.id===editId});Object.assign(rec,o)}
  else{o.id=Date.now();items.push(o);rec=o}
  put(rec);reset();render()});
function opt(v,t){var o=document.createElement("option");o.value=v;o.textContent=t;return o}
function buildDate(){
  var y=today().getFullYear(),i;
  for(i=1;i<=31;i++)$("dd").appendChild(opt(i,i));
  for(i=0;i<12;i++)$("dm").appendChild(opt(i+1,MON[i]));
  for(i=y-100;i<=y+30;i++)$("dy").appendChild(opt(i,i));
  var f=$("five");f.appendChild(opt("","Pilih tahun"));for(i=y+1;i>=y-40;i--)f.appendChild(opt(i,i));
  setD(iso(today()))}
function setD(str){var p=str.split("-");
  if(!$("dy").querySelector('option[value="'+(+p[0])+'"]'))$("dy").appendChild(opt(+p[0],+p[0]));
  $("dd").value=+p[2];$("dm").value=+p[1];$("dy").value=+p[0]}
function getD(){var y=+$("dy").value,m=+$("dm").value,d=+$("dd").value,mx=new Date(y,m,0).getDate();
  if(d>mx)d=mx;return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
var dp=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;$("inst").hidden=false});
$("instbtn").addEventListener("click",function(){if(dp){dp.prompt();dp=null;$("inst").hidden=true}});
window.addEventListener("appinstalled",function(){$("inst").hidden=true});
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone){
  $("inst").hidden=false;$("insttxt").textContent="Di Safari, ketuk tombol Bagikan lalu pilih “Tambah ke Layar Utama”.";$("instbtn").hidden=true}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(function(){})});
buildDate();load();hint();render();initDb();
</script>
</body>
